[project]
name = "agent-presse-quotidien"
version = "0.1.0"
description = "Agent de revue de presse quotidienne avec vérification croisée des sources (Médiapart, Frontières, Blast, Le Média, Orient XXI, Le Monde, Libération, Le Figaro, Les Échos, France Info)"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
